spring.application.name=SmartSlope

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/smartslope_db
spring.datasource.username=root
spring.datasource.password=Pavi@1908
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Initial Admin Account Credentials (Configurable via ENV vars)
smartslope.admin.name=${SMARTSLOPE_ADMIN_NAME:Administrator}
smartslope.admin.email=${SMARTSLOPE_ADMIN_EMAIL:Admin@gmail.com}
smartslope.admin.password=${SMARTSLOPE_ADMIN_PASSWORD:Admin@12345}
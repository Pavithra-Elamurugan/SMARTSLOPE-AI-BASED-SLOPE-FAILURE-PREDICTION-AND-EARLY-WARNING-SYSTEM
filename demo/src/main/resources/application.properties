spring.application.name=SmartSlope

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/smartslope_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=Pavi@1908
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool configuration
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA and Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Initial Admin Account Credentials (Configurable via ENV vars)
smartslope.admin.name=${SMARTSLOPE_ADMIN_NAME:Administrator}
smartslope.admin.email=${SMARTSLOPE_ADMIN_EMAIL:Admin@gmail.com}
smartslope.admin.password=${SMARTSLOPE_ADMIN_PASSWORD:Admin@12345}

# Spring Mail SMTP Configuration (Configurable via ENV vars)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:smartslope.alerts@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:smartslope_app_password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smartslope.mail.from=${SMARTSLOPE_MAIL_FROM:smartslope.alerts@gmail.com}